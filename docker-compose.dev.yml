version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: student_intel_backend_dev
    environment:
      - DATABASE_URL=sqlite:///student_intelligence.db
      - ENVIRONMENT=development
      - DEBUG=True
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: student_intel_frontend_dev
    ports:
      - "80:80"
    depends_on:
      - backend
