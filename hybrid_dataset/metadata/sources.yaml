# Source registry — hybrid_dataset
#
# This file is a tracked YAML list of SourceRegistry entries (see
# src/nlp_semantic/schema/source_registry.py). Chunk 4 ships it empty.
# Registration grants NO permission to train, redistribute, or publish
# from a source. Downstream training must gate on both:
#   - review_status == verified
#   - a human-approved license decision outside this file
# A row that merely exists here is NOT approval.
#
# To register a new source, append a mapping with these fields:
#
#   source_id:         src_<32 lowercase hex>        # make_id("src")
#   source_name:       "Short human-readable name"   # 1-120 chars
#   source_url:        "https://example.org/..."     # optional; http/https only
#                                                    # NEVER embed user:password@
#                                                    # credentials; strip them first
#   license:           "CC-BY-4.0" | "UNKNOWN" | ... # free text, 1-200 chars
#                                                    # "UNKNOWN" grants no permission
#   usage_restrictions: "..."                        # optional; <= 2000 chars
#   collection_date:   2026-10-21                    # ISO date; <= today + 1 day
#   original_labels:   ["label_a", "label_b"]        # verbatim from the source
#   intended_use:      "primary_type_training"       # 1-200 chars (free text)
#   mapping_notes:     "..."                         # optional; <= 2000 chars
#   review_status:     unreviewed | in_review | verified | rejected
#   is_synthetic:      false
#
# Annotator pseudonyms (used elsewhere in the project): follow the
# labeler_<NNN> convention (e.g. labeler_001). Pseudonym -> real identity
# mapping is NEVER stored in this repository.

- source_id: src_5a8a2998d6f44055a42dcfd8991e4d12
  source_name: "Smart India Hackathon 2024 Concludes with Innovative Solutions - PIB Release ID 2085000"
  source_url: "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2085000&lang=2&reg=48"
  license: "UNKNOWN"
  usage_restrictions: |
    PIB Copyright Policy, quoted verbatim from
    https://www.pib.gov.in/content/102_2_Copyright-Policy.aspx?reg=3&lang=1

    "Material featured on this website may be reproduced free of charge
    and there is no need for any prior approval for using the content.
    The permission to reproduce this material shall not extend to any
    third-party material. Authorisation to reproduce such material must
    be obtained from the departments/copyright holders concerned. The
    material must be reproduced accurately and not used in a derogatory
    manner or in a misleading context. Wherever the material is being
    published or issued to others, the source must be prominently
    acknowledged."

    Observed via browser screenshot capture during Chunk 7.3-A.4 human
    verification. license field recorded as UNKNOWN pending the
    Chunk 7.2 two-independent-reviewer sign-off on whether the blanket
    PIB free-reproduction clause covers this repository's intended_use
    (non-commercial research dataset of hackathon achievements).
  collection_date: 2026-10-23
  original_labels: []
  intended_use: "primary_type_training_lbl_hackathon"
  mapping_notes: |
    Smart India Hackathon 2024 (SIH) - hardware grand finale.
    Published by PIB Mumbai on 16 December 2024 at 19:40 IST; writing
    credit "PIB Pune | H.Akude/D.Rane"; Ministry banner "Ministry of
    Education". Venue: MIT-ADT University (MIT Art, Design, and
    Technology University), Pune, Maharashtra.

    Scope decision: TEAM-LEVEL hackathon achievements only. The
    Winners' List enumerates seven teams by team name + institution +
    state; no individual student names were present in the reviewed
    screenshots. Dignitaries (judges, officials) are named but are not
    participants. Do not infer individual records from team membership.

    Ingestion decision: TEXT ONLY. Photographs embedded in the release
    are plausibly third-party material and are excluded by the PIB
    policy's explicit third-party-material carve-out; separate
    permission would be required before any image is ingested.

    Build window: five-day hardware grand finale, which falls within
    the Chunk 7.1 seven-calendar-day bound for lbl_hackathon.

    Companion first-party corroboration (not registered as separate
    entries here): PRID 2082460, 2083154, 2083470, 2082700, 2083360,
    2083376, 2083688, 2084190.

    Unresolved items pending full-page review by two independent
    reviewers per Chunk 7.2: grand-finale start date; takedown or
    revocation clause in the copyright policy; policy last-updated
    date; exact attribution wording (the PIB policy requires
    acknowledgment but does not prescribe the exact "source" string).

    Initial state is review_status: unreviewed and license: UNKNOWN as
    the conservative holding registration. Promotion to verified (and
    population of license with the verbatim summary clause) requires
    two independent sign-off PR comments posted per the Chunk 7.2
    template before discussion between reviewers or with the proposer.
  review_status: unreviewed
  is_synthetic: false

- source_id: src_08ee850ba4b54d1b81cdbd652809b613
  source_name: "arXiv"
  source_url: "https://arxiv.org/"
  license: "CC0-1.0"
  usage_restrictions: |
    arXiv metadata license, verbatim from
    https://info.arxiv.org/help/license/index.html :

      "A Creative Commons CC0 1.0 Universal Public Domain Dedication
      will apply to all metadata."

    Evidence URLs re-verified on this entry's collection_date:
      - https://info.arxiv.org/help/license/index.html
      - https://info.arxiv.org/help/api/tou.html

    CC0 SCOPE: descriptive metadata only (title, abstract, authors
    public byline, identifiers, categories, DOI/journal_ref/comment,
    dates). Full governance:
    hybrid_dataset/metadata/arxiv_governance_decisions.md

    OFFICIAL METADATA ENDPOINTS (project policy, Chunk 7.18 Rev 1):
      - https://export.arxiv.org/api/query
      - https://oaipmh.arxiv.org/oai
    HTML scraping of /abs, /pdf, /src, /html, /format is DISALLOWED;
    `validate_metadata_endpoint` rejects such URLs if invoked.
    Policy surface only; no ingestion yet.

    RATE LIMIT (verbatim, API ToU): "make no more than one request
    every three seconds, and limit requests to a single connection
    at a time." Applies collectively across all machines. Code
    enforcement (rate_limit.py) is PROCESS-LOCAL (Chunk 7.20 shared
    default coordinator); global cross-machine guarantee NOT
    SATISFIED by code (operator discipline required).

    NOT AUTHORIZED: full-text PDFs, TeX/source files, figures,
    hosting/serving arXiv e-prints, article redistribution.
    Verbatim arXiv Bulk Data: "We are thus unable to grant others
    the right to distribute arXiv articles." Any future full-text
    use requires a SEPARATE SourceRegistry entry.

    ACKNOWLEDGMENT (project convention): "Thank you to arXiv for
    use of its open access interoperability". CC0 waives
    attribution legally. TRADEMARK: no implied arXiv endorsement.

    PRIVACY: public byline + arXiv paper ID only. Submitter contact
    emails: redaction policy via `redact_contact_emails` (Chunk 7.18
    Rev 4); no logger today - policy surface, not enforced.

    This registration does NOT initiate any API request or
    collection; collection is gated by a future review.
  collection_date: 2026-10-23
  original_labels: []
  intended_use: "primary_type_training_lbl_research_pub_metadata_only"
  mapping_notes: |
    arXiv.org - scholarly research metadata repository and API.
    Registration covers DESCRIPTIVE METADATA ONLY under CC0.

    CHUNK 7.18 GOVERNANCE: Mohan's revision implemented in
      src/nlp_semantic/ingestion/arxiv_governance.py (policies)
      src/nlp_semantic/ingestion/rate_limit.py (rate limiter)
    Full detail: hybrid_dataset/metadata/arxiv_governance_decisions.md

    STUDENT-ID: arXiv does NOT identify authors as students.
    Sanctioned student-link entry point:
    authorize_student_link(record, evidence) requires at least one
    of (orcid_verified, institutional_email_verified,
    advisor_verified) per Chunk 7.18 Rev 3. Name similarity,
    affiliation, and author position are NEVER sufficient. The
    Chunk 7.11 five-stage review still applies per-record.

    PRIMARY-TYPE: records are candidates for lbl_research_pub
    (currently status: draft; separate Chunk 7.2 promotion
    required). Records without a VERIFIED DOI or journal
    reference are classified unrefereed_preprint (Chunk 7.18
    Rev 3); verification is per-record external, not inferred
    from arXiv record, date, title, authors, or abstract.

    WITHDRAWALS: `is_withdrawn()` flags withdrawn/retracted
    patterns in comments. Future ingestion MUST exclude flagged
    papers (policy obligation; no ingestion today).

    DOMAIN-TAGS: arXiv categories (cs.CL, cs.LG, cs.CV, ...) are
    REVIEWER HINTS, NOT auto-applied. Per-paper human review per
    Chunk 6 agreement protocol. Empty domain_tags with verified
    status is legitimate per Chunk 6 Jaccard-empty-set.

    VERSIONING: dedup key for Achievement.source_record_id is
    the BASE arXiv ID ("arxiv-<id>"); version lives in a
    per-record YAML comment, not a schema field.

    PER-PAPER LICENSE: ArxivMetadataRecord.per_paper_license_uri
    = None means UNKNOWN; CC0 metadata scope does NOT grant
    full-text redistribution (Chunk 7.18 Rev 2).

    ROW 1 ONLY: Step 1 of Chunk 7.13 §5 eight-step chain.
    Promotion to review_status: verified requires a new human
    review of Chunk 7.18 revisions and two independent sign-offs
    per SOURCE_REGISTRATION_GUIDE.md.
  review_status: unreviewed
  is_synthetic: false
