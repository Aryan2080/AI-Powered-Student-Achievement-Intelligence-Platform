# Alembic Migration Configuration
# AI-Powered Student Achievement Intelligence Platform — Member 3

[alembic]
script_location = alembic
prepend_sys_path = .
version_locations = alembic/versions

sqlalchemy.url = sqlite:///student_intelligence.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
